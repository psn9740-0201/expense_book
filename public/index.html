<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 가계부</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 로그인 -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>나의 가계부</h1>
      <p class="muted">비밀번호를 입력해 주세요.</p>
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" class="btn primary">로그인</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- 메인 -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1>나의 가계부</h1>
      <button id="logout-btn" class="btn ghost">로그아웃</button>
    </header>

    <main class="container">
      <!-- 입력 폼 -->
      <section class="card">
        <h2 id="form-title">지출 추가</h2>
        <form id="expense-form" class="expense-form">
          <input type="hidden" id="expense-id">
          <label>날짜<input type="date" id="f-date" required></label>
          <label>항목<input type="text" id="f-item" maxlength="100" placeholder="예: 점심" required></label>
          <label>카테고리<select id="f-category" required></select></label>
          <label>금액(원)<input type="number" id="f-amount" min="0" step="1" placeholder="0" required></label>
          <div class="form-actions">
            <button type="submit" class="btn primary" id="submit-btn">추가</button>
            <button type="button" class="btn ghost" id="cancel-edit" hidden>취소</button>
          </div>
        </form>
        <p id="form-error" class="error" role="alert"></p>
      </section>

      <!-- 요약 -->
      <section class="stats-grid">
        <div class="card stat">
          <span class="muted">이번 달 지출</span>
          <strong id="stat-this-month">0원</strong>
        </div>
        <div class="card stat">
          <span class="muted">조회 결과 합계</span>
          <strong id="stat-filtered">0원</strong>
        </div>
        <div class="card stat">
          <span class="muted">조회 건수</span>
          <strong id="stat-count">0건</strong>
        </div>
      </section>

      <!-- 검색 + 목록 -->
      <section class="card">
        <div class="section-head">
          <h2>지출 내역</h2>
        </div>
        <form id="search-form" class="search-form">
          <select id="s-mode" aria-label="검색 방식">
            <option value="date">특정 날짜</option>
            <option value="range">기간</option>
            <option value="month">월</option>
          </select>
          <input type="date" id="s-date" aria-label="날짜">
          <input type="date" id="s-from" aria-label="시작일" hidden>
          <input type="date" id="s-to" aria-label="종료일" hidden>
          <input type="month" id="s-month" aria-label="월" hidden>
          <select id="s-category" aria-label="카테고리 필터"><option value="">전체 카테고리</option></select>
          <button type="submit" class="btn primary">검색</button>
          <button type="button" id="s-reset" class="btn ghost">전체 보기</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>날짜</th><th>항목</th><th>카테고리</th><th class="num">금액</th><th></th></tr>
            </thead>
            <tbody id="expense-list"></tbody>
          </table>
          <p id="empty" class="muted center" hidden>내역이 없습니다.</p>
        </div>
      </section>

      <!-- 월별 합계 -->
      <section class="card">
        <div class="section-head">
          <h2>월별 지출 합계</h2>
          <div class="inline">
            <button class="btn ghost small" id="year-prev" aria-label="이전 연도">◀</button>
            <span id="year-label"></span>
            <button class="btn ghost small" id="year-next" aria-label="다음 연도">▶</button>
          </div>
        </div>
        <div id="monthly-chart" class="col-chart"></div>
        <p class="muted right">연간 합계 <strong id="year-total">0원</strong></p>
      </section>

      <!-- 카테고리별 합계 -->
      <section class="card">
        <div class="section-head">
          <h2>카테고리별 지출</h2>
          <input type="month" id="cat-month" aria-label="카테고리 통계 월">
        </div>
        <div id="category-chart" class="bar-chart"></div>
        <p class="muted right">합계 <strong id="cat-total">0원</strong></p>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
